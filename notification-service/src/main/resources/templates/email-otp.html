<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Lumière Cosmetics</title>
</head>
<body style="margin:0;padding:0;background-color:#f9f5f0;font-family:'Helvetica Neue',Arial,sans-serif;">
<table width="100%" cellpadding="0" cellspacing="0" style="background-color:#f9f5f0;padding:40px 20px;">
    <tr>
        <td align="center">
            <table width="600" cellpadding="0" cellspacing="0" style="background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 4px 24px rgba(0,0,0,0.08);">
                <!-- Header -->
                <tr>
                    <td style="background:linear-gradient(135deg,#c8a96e,#a07850);padding:40px;text-align:center;">
                        <h1 style="margin:0;color:#fff;font-size:28px;letter-spacing:4px;font-weight:300;">LUMIÈRE</h1>
                        <p style="margin:8px 0 0;color:rgba(255,255,255,0.85);font-size:13px;letter-spacing:2px;">COSMETICS</p>
                    </td>
                </tr>
                <!-- Body -->
                <tr>
                    <td style="padding:48px 48px 32px;">
                        <h2 style="margin:0 0 16px;font-size:22px;color:#2d1f0f;">Xin chào, <span th:text="${fullName}">Người dùng</span>!</h2>
                        <p style="margin:0 0 24px;font-size:15px;color:#5c4a32;line-height:1.7;"
                           th:text="${purpose == 'FORGOT_PASSWORD'}
                               ? 'Chúng tôi nhận được yêu cầu từ tài khoản của bạn. Vui lòng sử dụng mã bên dưới để tiếp tục.'
                               : 'Bạn vừa thực hiện một yêu cầu trên tài khoản Lumière. Vui lòng sử dụng mã bên dưới để xác nhận.'">
                        </p>
                        <p style="margin:0 0 8px;font-size:14px;color:#5c4a32;">Mã của bạn:</p>
                        <p th:text="${otpCode}"
                           style="margin:0 0 24px;font-size:28px;font-weight:600;color:#2d1f0f;letter-spacing:6px;">
                            000000
                        </p>
                        <p style="margin:0;font-size:13px;color:#9c8a76;line-height:1.7;">
                            Mã này sẽ hết hạn sau 5 phút. Nếu bạn không thực hiện yêu cầu này, vui lòng bỏ qua email này.
                        </p>
                    </td>
                </tr>
                <!-- Footer -->
                <tr>
                    <td style="background:#f9f5f0;padding:24px 48px;text-align:center;border-top:1px solid #e8ddd0;">
                        <p style="margin:0;font-size:12px;color:#b0a090;">
                            © 2025 Lumière Cosmetics. Tất cả quyền được bảo lưu.
                        </p>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
