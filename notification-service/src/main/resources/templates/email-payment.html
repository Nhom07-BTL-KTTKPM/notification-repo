<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8"/>
    <title>Thông báo thanh toán — Lumière</title>
</head>
<body style="margin:0;padding:0;background-color:#f9f5f0;font-family:'Helvetica Neue',Arial,sans-serif;">
<table width="100%" cellpadding="0" cellspacing="0" style="background-color:#f9f5f0;padding:40px 20px;">
    <tr><td align="center">
        <table width="600" cellpadding="0" cellspacing="0" style="background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 4px 24px rgba(0,0,0,0.08);">
            <tr>
                <td style="background:linear-gradient(135deg,#c8a96e,#a07850);padding:40px;text-align:center;">
                    <h1 style="margin:0;color:#fff;font-size:28px;letter-spacing:4px;font-weight:300;">LUMIÈRE</h1>
                </td>
            </tr>
            <tr>
                <td style="padding:48px;">
                    <h2 style="margin:0 0 16px;font-size:20px;color:#2d1f0f;">Thông báo thanh toán</h2>
                    <p style="margin:0 0 24px;font-size:15px;color:#5c4a32;line-height:1.7;">
                        Xin chào <strong th:text="${fullName}">Khách hàng</strong>,<br/>
                        Giao dịch cho đơn hàng <strong th:text="${orderCode}">#ORD-001</strong> đã được ghi nhận.
                    </p>
                    <!-- Payment Status -->
                    <table cellpadding="0" cellspacing="0" style="margin-bottom:24px;">
                        <tr>
                            <td th:style="${paymentStatus == 'PAID'}
                                    ? 'background:#f0fdf4;border:1px solid #86efac;border-radius:8px;padding:12px 24px;'
                                    : 'background:#fef2f2;border:1px solid #fca5a5;border-radius:8px;padding:12px 24px;'">
                                <p th:style="${paymentStatus == 'PAID'} ? 'margin:0;font-size:14px;color:#166534;' : 'margin:0;font-size:14px;color:#991b1b;'"
                                   th:text="${paymentStatus == 'PAID'} ? '✓ Thanh toán thành công' : '✗ Thanh toán thất bại'">
                                    Trạng thái
                                </p>
                            </td>
                        </tr>
                    </table>
                    <p style="margin:0 0 8px;font-size:14px;color:#9c8a76;">Số tiền giao dịch:</p>
                    <p th:text="${#numbers.formatDecimal(amount, 0, 'COMMA', 0, 'POINT') + ' ₫'}"
                       style="margin:0;font-size:22px;font-weight:700;color:#7a5c2e;">0 ₫</p>
                    <p th:if="${paymentStatus != 'PAID'}"
                       style="margin:16px 0 0;font-size:13px;color:#9c8a76;">
                        Nếu bạn gặp sự cố thanh toán, vui lòng liên hệ hỗ trợ hoặc thử lại.
                    </p>
                </td>
            </tr>
            <tr>
                <td style="background:#f9f5f0;padding:24px 48px;text-align:center;border-top:1px solid #e8ddd0;">
                    <p style="margin:0;font-size:12px;color:#b0a090;">© 2025 Lumière Cosmetics.</p>
                </td>
            </tr>
        </table>
    </td></tr>
</table>
</body>
</html>
